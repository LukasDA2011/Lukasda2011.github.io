<html lang=en> 

    <head>
    
        <meta charset="UTF-8"> <!--Sets site to use standard characters.-->

        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <!-- Sizes your site to the visitor's screen size -->

        <meta name="author" content="Lukas Avila">
        <!--
            Some tags like "meta" are self-closing. They have "attributes" 
            but no inner content and they don't need or use a closing tag.
        -->

        <title>Main Website</title>
        <!--The 'title' is what's displayed in the browser tab.-->

        <link rel="stylesheet" href="/style.css">
        <!--
            HTML (HyperText Markup Language) code is for the website 
            content. CSS (Cascading Style Sheets) code is for the website 
            style. The line above tells the browser the file location and 
            file name to find this code that you'll write/edit there.
        -->

        <link rel="icon" type="image/png" href="/favicon.png">
        <!--
            If you made/found a favicon, export/name it exactly favicon.png
            and upload to the top level of your repo, then this line of
            code will use it as your site icon in the browser tab.
        -->

    </head>


    <body> <!--Everything to be displayed in the browser window.-->


        
        <!--example headings, paragraphs, lists-->
        <h1>New Media and Technology: Lukas Avila</h1>
        <p>Welcome. This is the colllection of all my past work, all in one website. Feel free to select anything that you want to explore. -Lukas A.</p>
    

        


        <!--example links-->
        <a href="/about.html">Link to page/file on your website</a>
        <a href="https://github.com" target="_blank">Link to
            external page on the web (_blank opens in new tab)</a>

    </body>
</html>
